[package]
name = "embed-lambda"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "embed_lambda"
path = "src/lib.rs"

[[bin]]
name = "embed"
path = "src/bin/embed.rs"

[[bin]]
name = "embed-cli"
path = "src/bin/embed-cli.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
lambda_runtime.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fastembed = { version = "6", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray"] }

[features]
default = ["bundled"]
bundled = ["ort/download-binaries", "ort/tls-rustls"]
dynamic = ["ort/load-dynamic"]
